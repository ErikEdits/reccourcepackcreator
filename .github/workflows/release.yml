name: Release

# A release is made when:
#  - main receives a commit whose package.json version has no published release yet
#    (so merging a version bump releases it), or
#  - a release with a tag like v0.1.0 is published on GitHub, or such a tag is pushed.
# The Windows and Linux installers are built and attached, and the release notes are
# taken from this version's section of CHANGELOG.md.
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Work out the release tag
        id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($tag)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the release or update its notes
        id: release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v heading="## [${TAG#v}]" \
            'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > notes.md
          title="Resource Pack Creator $TAG"

          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$GITHUB_REF_TYPE" = branch ] && [ "$draft" = false ]; then
              echo "$TAG is already released; nothing to do."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -s notes.md ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file notes.md
            fi
          else
            if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "$title" "${notes[@]}"
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package and upload to the release
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allow uploading to a release that was published on GitHub before this run.
          EP_GH_IGNORE_TIME: 'true'

  publish:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
